# Render Blueprint: deploys the game server as a free web service.
# On render.com: New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: doodle-game-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_TOKENS
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
