name: Release APK

# Builds the Android release APK and attaches it to a GitHub Release.
# Trigger it by pushing a version tag:   git tag v0.1.0 && git push origin v0.1.0
# Set the repository variable GAME_SERVER_URL (Settings → Secrets and variables → Actions →
# Variables) to the public game server URL so the APK connects to it by default.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}

    steps:
      # The native build (Skia, Reanimated, Worklets) needs more memory and disk than the
      # standard private-repo runner has spare, so add swap and drop toolchains we don't use.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /extra-swap
          sudo chmod 600 /extra-swap
          sudo mkswap /extra-swap
          sudo swapon /extra-swap
          free -h
          df -h /

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @doodle/mobile... build

      - name: Generate the native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # Both ARM ABIs: many budget phones (e.g. Redmi 9A) only run 32-bit apps.
      - name: Build release APK
        working-directory: apps/mobile/android
        run: >-
          ./gradlew assembleRelease
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m"

      - name: Rename APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk doodle-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: doodle-apk
          path: doodle-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: doodle-*.apk
          generate_release_notes: true
