name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: doodle
          POSTGRES_PASSWORD: doodle
          POSTGRES_DB: doodle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doodle -d doodle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://doodle:doodle@localhost:5432/doodle_test
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check migrations are in sync with the Drizzle schema
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "::error::Schema changed without a migration. Run pnpm --filter @doodle/db db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "::error::Schema changed without a migration. Run pnpm --filter @doodle/db db:generate" && git status --porcelain -- drizzle && exit 1)
